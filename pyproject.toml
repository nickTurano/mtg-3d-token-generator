[project]
name = "mtg-3d-token-generator"
version = "0.1.0"
description = "Generate standard-card-size 3D printable tabletop token assets from MTG token metadata."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nick Turano", email = "nickt803@gmail.com" }]
dependencies = [
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mtg-token-generator = "mtg_token_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_token_generator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
